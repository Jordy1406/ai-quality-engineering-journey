name: tests

on:
  push:
  pull_request:
  workflow_dispatch: # "Run workflow" button in the Actions tab -> also runs live LLM tests

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: pip install -r requirements.txt -e .
      - run: pytest -m "not live"

  live:
    # Only on manual runs, so every push doesn't spend API quota.
    if: github.event_name == 'workflow_dispatch'
    needs: offline
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: pip install -r requirements.txt -e .
      - run: pytest -m live
